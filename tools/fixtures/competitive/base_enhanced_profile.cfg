// base_enhanced competitive Force profile (owner decisions, 2026-10-08).
// Ported code: codemp/game/be_force.c; manifest: docs/ports/base_enhanced.json.
// These are also the defaults since 2026-10-08 (owner); stock_force_profile.cfg restores stock OpenJK Force.
// exec before the map loads: g_drainRework and g_gripRework are latched (they apply at the next map).
// Kept at xenjk's environment: sv_fps 40, g_gravity 800, g_forceRegenTime 200 (not base_enhanced's).
// g_lightningRework is not ported (owner: off).

// reworks (base_enhanced latched cvars)
set g_drainRework 2
set g_gripRework 2

// base_enhanced changes upstream made unconditionally (xenjk switches)
set g_beGripCooldowns 1
set g_beGripDistance 1
set g_bePushKnockedDown 1
set g_beTeamEnergizeLiving 1

// protect and team powers
set g_protect3DamageReduction 0.70
set g_redirectWrongThTeBinds 1

// base_enhanced defaults, stated so the profile is complete
set g_gripAbsorbFix 0
set g_gripRefreshRate 300
set g_thTeRequiresLOS 0
set g_fixForceTimers 1
set g_sendForceTimers 1

// fights, weapons and spawns (be_combat.c)
set g_locationBasedDamage 2
set g_droppedFlagSpawnProtectionRadius 1024
set g_droppedFlagSpawnProtectionDuration 10000
set g_fixWeaponChargeTime 1
set g_improvedHoming 1
set g_improvedHomingThreshold 500
set g_fixCorpseSniping 1
set g_fixFreshWeaponAmmo 1
set g_fixDisarmFiring 1
set g_beThermalDirectDamage 1
set g_beSaberOneshotsExplosives 1

// movement and shared weapon code (be_pmove.c; also predicted by the client through configstring 25)
set g_beHeadFriction 1
set g_beRoll100 1
set g_fixRoll 1
set g_fixWallgrab 1
set g_fixForceJumpAnimationLock 1
set g_beDfaJumpCheck 1
set g_fixDempSaberThrow 1
set g_fixNoAmmoShootAnimation 1
set g_fix5AmmoSniping 1
